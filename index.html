<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canales</title>
<style>
:root{--tx:#111827;--mu:#6b7280;--li:#e5e7eb;--up:#15803d;--dn:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 28px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 32px;padding-bottom:32px;border-bottom:1px solid var(--li);margin-bottom:40px}
.tot b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tot span{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.card{border:1px solid var(--li);border-radius:20px;padding:28px;border-top:4px solid var(--c)}
.head{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.head img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#f3f4f6;flex:none}
.head h2{margin:0;font-size:20px;line-height:1.2}
.head a{color:var(--mu);font-size:14px;text-decoration:none}.head a:hover{color:var(--c);text-decoration:underline}
.nicho{color:var(--mu);font-size:14px;margin:0 0 22px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.m div b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.m div span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.m small{display:block;font-size:13px;font-weight:600;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.eq{color:var(--mu)}
.var{margin-top:20px;padding-top:16px;border-top:1px solid var(--li);display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
.var i{font-style:normal;color:var(--mu)}.var strong{font-weight:600}
.var .h{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.fe{margin-top:16px;font-size:12px;color:#9ca3af}
footer{margin-top:40px;font-size:13px;color:var(--mu)}
@media(max-width:480px){main{padding:28px 16px}.tot b{font-size:32px}.card{padding:22px}}

main{max-width:1400px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
.layout .grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.lb{position:sticky;top:20px;border-radius:22px;padding:20px 16px 18px;max-height:calc(100vh - 40px);overflow:auto;color:#fff;background:radial-gradient(120% 60% at 50% 0,#4c1d95 0,#1e1b4b 45%,#0f172a 100%);box-shadow:0 18px 40px -12px rgba(76,29,149,.55),inset 0 0 0 1px rgba(255,255,255,.08);--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
.lbh{display:flex;align-items:center;gap:8px;margin:0 4px 14px}
.lbh h2{margin:0;font:900 20px/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,#fde047,#fb923c,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbh .sp{flex:1}
.lb .i{color:#c4b5fd;border-color:#a78bfa88}
.rows{display:flex;flex-direction:column;gap:8px}
.r{position:relative;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.09),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);cursor:pointer;overflow:hidden;opacity:0;transform:translateX(-28px);animation:ent .55s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--k)*90ms)}
.r::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.r.p1{background:linear-gradient(90deg,rgba(250,204,21,.28),rgba(251,146,60,.10));box-shadow:inset 0 0 0 1.5px #facc15,0 0 26px -4px rgba(250,204,21,.55)}
.r.p2{box-shadow:inset 0 0 0 1px #cbd5e1aa}.r.p3{box-shadow:inset 0 0 0 1px #d97706aa}
.r:focus-visible{outline:2px solid #fde047}
.rm{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px 10px 14px}
.p1 .rm{padding:16px 12px 16px 14px;grid-template-columns:68px minmax(0,1fr) auto}
.ps{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.med{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 19px/1 "Arial Black",system-ui,sans-serif;color:#1f2937;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -3px 5px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.6)}
.p1 .med{width:48px;height:48px;font-size:24px;background:radial-gradient(circle at 35% 30%,#fff7b0,#facc15 55%,#ca8a04)}
.p2 .med{background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 55%,#64748b)}
.p3 .med{background:radial-gradient(circle at 35% 30%,#ffe2c2,#e08a3c 55%,#92400e)}
.p4 .med,.p5 .med,.p6 .med,.p7 .med,.p8 .med{background:rgba(255,255,255,.1);color:#e9d5ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.crown{position:absolute;top:-17px;font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:flot 2.4s ease-in-out infinite}
.mv{font:800 11px/1 var(--mono);white-space:nowrap}
.mv.up{color:#4ade80}.mv.dn{color:#f87171}.mv.eq{color:#94a3b8}.mv.nw{color:#67e8f9}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#312e81;flex:none;box-shadow:0 0 0 2px var(--c)}
.p1 .who img{width:58px;height:58px;box-shadow:0 0 0 3px #facc15,0 0 16px #facc1599}
.who div{min-width:0}
.who b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1 .who b{font-size:18px}
.who .tg{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.chip{font:800 10px/1 var(--mono);padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.12);color:#e9d5ff;letter-spacing:.04em;white-space:nowrap}
.chip.f{background:rgba(251,146,60,.2);color:#fdba74}
.sc{text-align:right}
.sc b{display:block;font:900 26px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px var(--c)}
.p1 .sc b{font-size:34px;color:#fde047}
.sc small{font:700 10px/1 var(--mono);color:#a5b4fc;letter-spacing:.1em}
.xp{height:8px;margin:0 14px 12px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.xp u{display:block;height:100%;width:0;border-radius:5px;min-width:3px;background:linear-gradient(90deg,var(--c),#fff9);animation:llena 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--k)*90ms + 350ms)}
.tro{position:absolute;right:8px;top:6px;font-size:20px;animation:flot 2.4s ease-in-out infinite;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5));z-index:2}
.st{display:none;padding:2px 14px 14px;border-top:1px dashed rgba(255,255,255,.15)}
.r.open .st{display:block;animation:ent2 .3s ease both}
.st .g{display:flex;justify-content:space-between;font:800 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fcd34d;margin:12px 0 4px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:12px;margin-top:6px}
.sr span{color:#c7d2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr b{font:800 13px/1 var(--mono);display:flex;gap:4px;align-items:center}
.sr .sb{grid-column:1/-1;height:6px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}
.sr .sb u{display:block;height:100%;min-width:2px;border-radius:4px;background:var(--c)}
.sr .vv{grid-column:1/-1;font:600 10px/1 var(--mono);color:#818cf8}
.r.sube{animation-name:ent,sube;animation-duration:.55s,1.4s;animation-delay:calc(var(--k)*90ms),calc(var(--k)*90ms + .6s);animation-fill-mode:forwards,none}
.r.baja{animation-name:ent,baja;animation-duration:.55s,1.4s;animation-delay:calc(var(--k)*90ms),calc(var(--k)*90ms + .6s);animation-fill-mode:forwards,none}
@keyframes ent{to{opacity:1;transform:none}}
@keyframes ent2{from{opacity:0;transform:translateY(-6px)}}
@keyframes llena{to{width:var(--w)}}
@keyframes flot{50%{transform:translateY(-3px) rotate(4deg)}}
@keyframes sube{0%,100%{filter:none}30%{filter:drop-shadow(0 0 14px #4ade80)}}
@keyframes baja{0%,100%{filter:none}30%{filter:drop-shadow(0 0 14px #f87171)}}
.i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid #9ca3af99;color:#6b7280;font:700 11px/1 system-ui,serif;font-style:italic;background:transparent;cursor:pointer;padding:0;vertical-align:middle}
.i:hover{color:#fff;background:#6366f1;border-color:#6366f1}
#pop{position:absolute;z-index:50;max-width:min(300px,calc(100vw - 24px));background:#111827;color:#f3f4f6;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
@media(prefers-reduced-motion:reduce){.r,.xp u,.crown,.tro{animation-duration:.01s!important;animation-delay:0s!important}}
@media(max-width:480px){.rm{grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding:10px 10px 10px 12px}.p1 .rm{grid-template-columns:58px minmax(0,1fr) auto}.sc b{font-size:22px}.p1 .sc b{font-size:28px}.who img{width:38px;height:38px}.p1 .who img{width:48px;height:48px}.who b{font-size:14px}.p1 .who b{font-size:16px}}
.act{display:flex;gap:10px;align-items:center;margin:-8px 0 28px;font-size:12px;color:var(--mu)}
.act button#bt{font:inherit;font-size:18px;line-height:1;border:1px solid var(--li);background:#fff;color:var(--tx);border-radius:999px;width:36px;height:36px;cursor:pointer}.act button#bt.gira{animation:gir 1s linear infinite}@keyframes gir{to{transform:rotate(360deg)}}
.act button:hover{border-color:var(--mu)}.act button:disabled{opacity:.5;cursor:default}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.lb{position:static;max-height:none;order:-1}}
</style>
</head>
<body>
<main>
<h1>Mis canales</h1>
<section class="tot" id="tot"></section>
<div class="act"><button id="bt" type="button" aria-label="Actualizar" title="Actualizar">⟳</button><span id="ed"></span><button class="i" id="inf" type="button" aria-label="Información">i</button></div>
<div class="layout"><section class="grid" id="grid"></section><aside class="lb" id="lb"></aside></div>
<footer id="pie"></footer>
<div id="pop" role="tooltip"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const N=new Intl.NumberFormat('es-CL');
const fmt=v=>v==null?null:N.format(Math.round(v*10)/10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hora=iso=>{if(!iso)return null;const d=new Date(iso);return isNaN(d)?null:d.toLocaleString('es-CL',{timeZone:'America/Santiago',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
function delta(v){
  if(!v)return '<span class="eq">–</span>';
  const d=v.delta,c=d>0?'up':d<0?'dn':'eq',a=d>0?'▲':d<0?'▼':'■';
  return `<span class="${c}">${a} ${d>0?'+':''}${fmt(d)}</span>`;
}
function big(v,label,extra){
  if(v==null)return '';
  return `<div><b>${fmt(v)}</b><span>${label}</span>${extra||''}</div>`;
}
function viejo(c){const t=Date.parse(c.medidoEn||c.fechaDatos);if(!t)return '';const d=Math.floor((Date.now()-t)/864e5);return d>=2?` · <span class="dn">hace ${d} días</span>`:''}
function card(c){
  const sub=c.varSubs?.ayer, vv=c.varVistas?.ayer;
  const hayVar=c.varSubs?.ayer||c.varSubs?.sem||c.varVistas?.ayer||c.varVistas?.sem;
  const dias=v=>v&&v.dias>1?` <i>(${v.dias} d)</i>`:'';
  const med=hora(c.medidoEn)||c.fechaDatos;
  return `<article class="card" style="--c:${esc(c.color||'#888')}">
  <div class="head"><img src="${esc(c.avatar)}" alt="" onerror="this.style.visibility='hidden'">
    <div><h2>${esc(c.nombre)}</h2><a href="${esc(c.url||'#')}" target="_blank" rel="noopener">${esc(c.handle||'')}</a></div></div>
  ${c.nicho?`<p class="nicho">${esc(c.nicho)}</p>`:''}
  <div class="m">
    ${big(c.subs,'suscriptores')}
    ${big(c.vistas,'vistas totales')}
    ${big(c.videos,'videos')}
    ${big(c.horas,'horas de visionado')}
    ${big(c.vistas28d,'vistas, 28 días')}
    ${c.vistas48h?big(c.vistas48h,'vistas, 48 h'):''}
  </div>
  ${hayVar?`<div class="var"><span class="h"></span><span class="h">Suscriptores</span><span class="h">Vistas</span>
    ${c.varSubs?.ayer||c.varVistas?.ayer?`<i>vs ayer</i><strong>${delta(c.varSubs?.ayer)}</strong><strong>${delta(c.varVistas?.ayer)}</strong>`:''}
    ${c.varSubs?.sem||c.varVistas?.sem?`<i>vs 7 días</i><strong>${delta(c.varSubs?.sem)}${dias(c.varSubs?.sem)}</strong><strong>${delta(c.varVistas?.sem)}${dias(c.varVistas?.sem)}</strong>`:''}
  </div>`:''}
  ${med?`<div class="fe">Medido: ${esc(med)}${viejo(c)}</div>`:''}
</article>`;
}
const TIP={
 puntaje:'Puntaje = promedio de los % de monetización: suscriptores (meta 1.000), vistas de Shorts en 90 días (meta 10 M) y horas de visionado (meta 4.000). Cada criterio tiene tope 100 %.',
 ritmo:'Ritmo = promedio de lo avanzado en la última semana: suscriptores nuevos, vistas nuevas y videos publicados, frente a la meta semanal de cada canal. No entra al puntaje; de él sale el ganador de la semana.',
 flecha:'Flecha: puestos que subió (▲) o bajó (▼) frente al cierre de ayer (última medición antes de las 00:00, hora de Chile). "–" = se mantuvo; "nuevo" = ayer aún no puntuaba.',
 est:'Estimado: el canal tiene menos de 90 días, así que se usan sus vistas totales como vistas de 90 días.',
 nivel:'Nivel = 1 + un nivel por cada 10 puntos de puntaje.',
 trofeo:'Ganador de la semana: el canal con mejor ritmo.'
};
const pf=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('es-CL')+' %';
const pn=v=>v==null?'–':(Math.round(v*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
const ib=k=>`<button class="i" type="button" data-tip="${k}" aria-label="Información">i</button>`;
function mv(c){
  if(!c||c.estado==='sin-datos')return '<span class="mv eq">–</span>';
  if(c.estado==='nuevo')return '<span class="mv nw">nuevo</span>';
  if(c.estado==='igual'||!c.puestos)return '<span class="mv eq">–</span>';
  const up=c.estado==='sube';
  return `<span class="mv ${up?'up':'dn'}">${up?'▲':'▼'}${c.puestos}</span>`;
}
function stats(t){
  const g=(id,tit,r)=>`<div class="g"><span>${tit}</span><span>${r&&r.puntaje!=null?pf(r.puntaje)+' · '+r.n+'/'+r.total:''}</span></div>`+t.criterios.filter(x=>x.grupo===id).map(x=>`<div class="sr"><span>${esc(x.nombre)}</span><b>${x.pct==null?'–':pf(x.pct)}${x.estimado?ib('est'):''}</b><div class="sb"><u style="width:${x.pct||0}%"></u></div>${x.valor!=null?`<div class="vv">${fmt(x.valor)} / ${fmt(x.meta)} ${esc(x.unidad||'')}</div>`:''}</div>`).join('');
  return `<div class="st">${g('monetizacion','Monetización',{puntaje:t.puntaje,n:t.n,total:t.total})}${g('ritmo','Ritmo semanal',t.ritmo)}</div>`;
}
const POS_KEY='panel.posiciones';
function leaderboard(p){
  let prev={};try{prev=JSON.parse(localStorage.getItem(POS_KEY)||'{}')}catch(e){}
  const gan=p.ganadorSemana&&p.ganadorSemana.slug;
  const filas=p.tabla.map((t,k)=>{
    const ant=prev[t.slug],cls=ant==null||ant===t.posicion?'':ant>t.posicion?' sube':' baja';
    const nv=1+Math.floor((t.puntaje||0)/10);
    return `<div class="r p${t.posicion}${cls}" style="--c:${esc(t.color)};--k:${k};--w:${Math.min(100,Math.max(1.5,t.puntaje||0))}%" tabindex="0" role="button" aria-expanded="false">
    ${gan===t.slug?`<span class="tro" title="Ganador de la semana">🏆</span>`:''}
    <div class="rm"><div class="ps">${t.posicion===1?'<span class="crown">👑</span>':''}<span class="med">${t.posicion}</span>${mv(t.cambio24h)}</div>
    <div class="who"><img src="${esc(t.avatar)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(t.nombre)}</b><div class="tg"><span class="chip f">🔥 ${pf(t.ritmo&&t.ritmo.puntaje)}</span><span class="chip">NIV ${nv}</span></div></div></div>
    <div class="sc"><b>${pn(t.puntaje)}</b><small>PTS</small></div></div>
    <div class="xp"><u></u></div>${stats(t)}</div>`;}).join('');
  try{localStorage.setItem(POS_KEY,JSON.stringify(Object.fromEntries(p.tabla.map(t=>[t.slug,t.posicion]))))}catch(e){}
  return `<div class="lbh"><h2>Leaderboard</h2><span class="sp"></span>${ib('puntaje')}${ib('ritmo')}${ib('flecha')}</div><div class="rows">${filas}</div>`;
}
let proximaMs=null,medidoMs=null,INFO='';
const hm=d=>d.toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit'});
let msg='',ultHash=null,ultCambio=null;
function reloj(){
  const m=medidoMs?Math.max(0,Math.round((Date.now()-medidoMs)/60000)):null;
  const d=m==null?'':'datos de hace '+(m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min');
  $('ed').textContent=[msg,d].filter(Boolean).join(' · ');
}
async function cargar(){
  const bt=$('bt');bt.disabled=true;bt.classList.add('gira');msg='actualizando…';reloj();
  const ini=Date.now();
  try{
    const j=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error(u+' '+x.status);return x.json()});
    const [r,p,a]=await Promise.all([j('data/resumen.json'),j('data/puntajes.json').catch(()=>null),j('data/adelantamientos.json').catch(()=>null)]);
    const h=(r.generadoEn||'')+'|'+(p&&p.generadoEn||'')+'|'+((r.actualizacion||{}).medidoEn||'');
    const igual=ultHash===h;
    const t=r.totales;
    $('tot').innerHTML=[[t.subs,'suscriptores'],[t.vistas,'vistas'],[t.videos,'videos'],[t.canales,'canales']].map(([v,l])=>`<div><b>${fmt(v)}</b><span>${l}</span></div>`).join('');
    const orden=p?p.tabla.map(x=>x.slug):[];
    const cs=[...r.canales].sort((x,y)=>{const i=orden.indexOf(x.slug),j2=orden.indexOf(y.slug);return (i<0?99:i)-(j2<0?99:j2)});
    $('grid').innerHTML=cs.map(card).join('');
    $('lb').innerHTML=p?leaderboard(p):'<div class="lbh"><h2>Leaderboard</h2></div>';
    const ac=r.actualizacion||{};
    medidoMs=Date.parse(ac.medidoEn||r.generadoEn)||null;proximaMs=Date.parse(ac.proxima||'')||null;
    if(!igual||ultCambio==null)ultCambio=new Date();
    msg=ultHash==null?'actualizado '+hm(new Date()):igual?'sin cambios desde '+hm(ultCambio):'actualizado '+hm(new Date());
    ultHash=h;
    INFO='Los datos se miden cada hora (desde el PC de Santiago y, si está apagado, desde la nube) y la página solo se republica cuando cambian los números. GitHub Pages guarda copias hasta ~10 min, así que un cambio recién publicado puede tardar en verse. ⟳ vuelve a pedir el último dato publicado. Publicado: '+(hora(r.generadoEn)||'')+(proximaMs?'. Próxima medición ≈ '+hm(new Date(proximaMs)):'')+(ac.error?'. La última consulta a la API falló: se muestra lo último conocido.':'');
  }catch(e){msg='sin conexión, reintenta';}
  reloj();
  setTimeout(()=>{bt.disabled=false;bt.classList.remove('gira')},Math.max(0,700-(Date.now()-ini)));
}
const pop=$('pop');
function abre(b,txt){pop.textContent=txt;pop.style.display='block';const r=b.getBoundingClientRect(),w=pop.offsetWidth;pop.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+scrollX-w/2+8))+'px';pop.style.top=(r.bottom+scrollY+8)+'px';pop._b=b}
document.addEventListener('click',e=>{
  const b=e.target.closest('.i');
