<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canales</title>
<style>
:root{--tx:#111827;--mu:#6b7280;--li:#e5e7eb;--up:#15803d;--dn:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 28px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 32px;padding-bottom:32px;border-bottom:1px solid var(--li);margin-bottom:40px}
.tot b{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tot span{font-size:13px;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.card{border:1px solid var(--li);border-radius:20px;padding:28px;border-top:4px solid var(--c)}
.head{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.head img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#f3f4f6;flex:none}
.head h2{margin:0;font-size:20px;line-height:1.2}
.head a{color:var(--mu);font-size:14px;text-decoration:none}.head a:hover{color:var(--c);text-decoration:underline}
.nicho{color:var(--mu);font-size:14px;margin:0 0 22px}
.m{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.m div b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.m div span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.m small{display:block;font-size:13px;font-weight:600;margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.eq{color:var(--mu)}
.var{margin-top:20px;padding-top:16px;border-top:1px solid var(--li);display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
.var i{font-style:normal;color:var(--mu)}.var strong{font-weight:600}
.var .h{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.fe{margin-top:16px;font-size:12px;color:#9ca3af}
footer{margin-top:40px;font-size:13px;color:var(--mu)}
@media(max-width:480px){main{padding:28px 16px}.tot b{font-size:32px}.card{padding:22px}}

main{max-width:1400px}
:root{--ok:#15803d;--bad:#b91c1c;--wa:#b45309;--gris:#f9fafb;--oro:#c9a227;--plata:#9ca3af;--bron:#b87333}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.layout .grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.lb{position:sticky;top:20px;border:1px solid var(--li);background:var(--gris);border-radius:16px;padding:18px 14px 12px;max-height:calc(100vh - 40px);overflow:auto;font-variant-numeric:tabular-nums}
.lbh{display:flex;align-items:center;gap:8px;margin:0 6px 12px}
.lbh h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.lbh .sp{flex:1}
.rows{display:flex;flex-direction:column}
.r{position:relative;border-top:1px solid var(--li);cursor:pointer;background:transparent;border-radius:10px;opacity:0;animation:ent .35s ease forwards;animation-delay:calc(var(--k)*40ms)}
.r:first-child{border-top-color:transparent}
.r.p1{background:#fff;border:1px solid #e6d9a8;box-shadow:inset 3px 0 0 var(--oro);margin-bottom:2px}
.r.p1+.r{border-top-color:transparent}
.r:focus-visible{outline:2px solid #94a3b8;outline-offset:1px}
.rm{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}
.ps{display:flex;align-items:center;gap:5px}
.med{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 system-ui,sans-serif;color:#fff;background:transparent;border:1px solid #d1d5db;color:var(--mu)}
.p1 .med{background:var(--oro);border-color:var(--oro);color:#fff}
.p2 .med{background:var(--plata);border-color:var(--plata);color:#fff}
.p3 .med{background:var(--bron);border-color:var(--bron);color:#fff}
.mv{font-size:10px;line-height:1;white-space:nowrap;font-weight:600}
.mv.up{color:var(--up)}.mv.dn{color:var(--dn)}.mv.eq{color:#9ca3af}.mv.nw{color:#2563eb}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#f3f4f6;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c)}
.who div{min-width:0}
.who b{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tg{font-size:11px;color:var(--mu);margin-top:1px}
.tro{font-size:12px;margin-left:4px;font-weight:400}
.sc{text-align:right}
.sc b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.p1 .sc b{color:#8a6d0b}
.sc small{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.xp{height:3px;margin:0 12px 10px;border-radius:2px;background:#e5e7eb;overflow:hidden}
.xp u{display:block;height:100%;width:0;border-radius:2px;min-width:2px;background:var(--c);animation:llena .8s ease forwards;animation-delay:calc(var(--k)*40ms + 200ms)}
.st{display:none;padding:2px 12px 12px;border-top:1px solid var(--li);margin:0 0 0}
.r.open .st{display:block}
.st .g{display:flex;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:12px 0 2px}
.sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:12px;margin-top:6px}
.sr span{color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr b{font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center}
.sr .sb{grid-column:1/-1;height:3px;border-radius:2px;background:#e5e7eb;overflow:hidden}
.sr .sb u{display:block;height:100%;min-width:2px;border-radius:2px;background:var(--c)}
.sr .vv{grid-column:1/-1;font-size:10px;color:#9ca3af}
@keyframes ent{to{opacity:1}}
@keyframes llena{to{width:var(--w)}}
.i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid #cbd5e1;color:#6b7280;font:700 10px/1 system-ui,serif;font-style:italic;background:transparent;cursor:pointer;padding:0;vertical-align:middle}
.i:hover{color:#fff;background:#6b7280;border-color:#6b7280}
#pop{position:absolute;z-index:50;max-width:min(300px,calc(100vw - 24px));background:#111827;color:#f3f4f6;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
@media(prefers-reduced-motion:reduce){.r,.xp u{animation-duration:.01s!important;animation-delay:0s!important}}
@media(max-width:480px){.rm{grid-template-columns:42px minmax(0,1fr) auto;gap:8px;padding:10px}.sc b{font-size:18px}}
/* cabecera, campana y notificaciones */
.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 28px;position:relative}
.top h1{margin:0}
.bell{position:relative;border:1px solid var(--li);background:#fff;border-radius:999px;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;color:var(--tx)}
.bell:hover{border-color:var(--mu)}
.bell svg{width:18px;height:18px}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--mu);color:#fff;font:600 11px/18px system-ui;text-align:center;padding:0 4px}
.bell.crit .n{background:var(--bad)}
.nl{display:none;position:absolute;right:0;top:46px;z-index:40;width:min(440px,calc(100vw - 32px));background:#fff;border:1px solid var(--li);border-radius:14px;box-shadow:0 14px 40px rgba(17,24,39,.14);max-height:70vh;overflow:auto}
.nl.open{display:block}
.nl h3{margin:0;padding:14px 16px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.ni{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:10px 16px;border-top:1px solid var(--li);font-size:13px}
.ni .d{width:8px;height:8px;border-radius:50%;margin-top:6px;background:#9ca3af}
.ni.critica .d{background:var(--bad)}.ni.aviso .d{background:#d97706}.ni.info .d{background:#9ca3af}
.ni b{font-weight:600}.ni small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.ni.vacio{color:var(--mu);display:block}
.franja{display:none;align-items:center;gap:10px;margin:-12px 0 24px;padding:9px 14px;border:1px solid #f3c9c9;background:#fdf5f5;border-radius:10px;font-size:13px;color:#7f1d1d;cursor:pointer}
.franja.on{display:flex}
.franja span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* tablero y permisos */
.sec{margin-top:56px}
.sec h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:0 0 4px;display:flex;gap:8px;align-items:center}
.sec .sub{font-size:12px;color:#9ca3af;margin:0 0 16px}
.tw{overflow-x:auto;border:1px solid var(--li);border-radius:16px}
table.tb{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
.tb th,.tb td{padding:11px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--li);font-size:13px}
.tb thead th{border-top:0;font-size:12px;font-weight:600;color:var(--tx);border-bottom:2px solid var(--c,#e5e7eb);background:var(--gris)}
.tb tbody th{font-weight:500;color:#374151;width:24%;background:#fff;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--li)}
.tb thead th:first-child{position:sticky;left:0;z-index:2}
.tb td{width:19%}
.cl{display:flex;gap:7px;align-items:flex-start}
.ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 system-ui;color:#fff;background:#d1d5db;margin-top:1px}
.s-ok .ic{background:var(--ok)}.s-bad .ic{background:var(--bad)}.s-warn .ic{background:#d97706}
.cl b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.s-na .cl b,.s-sd .cl b{color:#9ca3af;font-weight:500}
.cl small{display:block;font-size:11px;color:var(--mu);line-height:1.3;margin-top:1px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.pc{border:1px solid var(--li);border-radius:16px;padding:16px 18px;border-top:3px solid var(--c)}
.pc h3{margin:0 0 6px;font-size:15px}
.pi{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid #f1f2f4;font-size:13px;align-items:start}
.pi:first-of-type{border-top:0}
.pi>span{color:var(--mu);font-size:12px;padding-top:1px}
.glob{margin-top:12px;font-size:13px;color:#374151;display:flex;gap:8px;align-items:flex-start}
.fe2{font-size:12px;color:#9ca3af;margin-top:14px}
@media(max-width:480px){.tb th,.tb td{padding:9px 8px}.tb tbody th{font-size:12px}}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.lb{position:static;max-height:none;order:-1}}
.tr{margin-top:6px;font-size:11px;line-height:1.3;border-radius:8px;padding:4px 7px;display:block}
.tr small{display:block;color:inherit;opacity:.85;margin-top:1px;font-size:11px}
.tr i{font-style:normal;opacity:.75}
.tr.on{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.tr.sin{background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb}
.ft{border:1px solid var(--li);border-radius:14px;padding:12px 14px;margin:0 0 20px;background:#f8fafc;font-size:13px}
.ft.off{color:var(--mu);background:#fff}
.ft>b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.fi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:6px 0 6px 10px;border-top:1px solid #eef0f3;border-left:3px solid var(--c,#ccc);margin-top:6px}
.fc{font-weight:600}.fq{color:#374151}.fa{color:var(--mu);font-size:12px;text-align:right}
.fi small{grid-column:1/-1;color:var(--mu);font-size:12px}
@media(max-width:560px){.fi{grid-template-columns:1fr}.fa{text-align:left}}
.nav{position:sticky;top:0;z-index:30;background:#fffe;backdrop-filter:blur(8px);border-bottom:1px solid var(--li)}
.nav div{max-width:1120px;margin:0 auto;padding:0 24px;display:flex;gap:4px;align-items:center}
.nav a{padding:13px 14px;font-size:14px;font-weight:600;color:var(--mu);text-decoration:none;border-bottom:3px solid transparent}
.nav a:hover{color:var(--tx)}.nav a.on{color:var(--tx);border-bottom-color:var(--tx)}
.nav span{margin-left:auto;font-size:12px;color:#9ca3af}
main{padding-top:28px!important}
.m{gap:20px 16px}.m div span{display:flex;gap:5px;align-items:center}
.hv{margin-top:20px;font-size:13px;color:#374151}.hv b{font-weight:700}.hv .xp{margin:6px 0 0}.hv .na{color:#9ca3af}
.card .xp u{animation:none;width:var(--w)}
.cf{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.ub{border:1px solid;border-radius:999px;padding:4px 11px;font:600 12px/1.2 system-ui;cursor:pointer;background:#fff}
.ub.crit{color:#b91c1c;border-color:#fca5a5;background:#fef2f2}.ub.avi{color:#b45309;border-color:#fcd34d;background:#fffbeb}
.ok0{font-size:12px;color:#9ca3af}
.gb{margin-left:auto;border:1px solid var(--li);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--tx);text-decoration:none}.gb:hover{border-color:var(--mu)}
.ul{display:none;margin-top:10px;font-size:12px;border-top:1px solid var(--li)}.ul.on{display:block}
.ul div{padding:6px 0;border-bottom:1px solid #f1f2f4}.ul small{display:block;color:var(--mu)}
.vm{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;padding:0;margin-top:16px;text-decoration:underline}
.vm:hover{color:var(--tx)}
.var{display:none}.var.on{display:grid}
.wk{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 3px;margin-top:4px;border-radius:6px;display:inline-block}
.wk:hover{background:#eff6ff}
.wk.on{animation:giro 4s linear infinite}.wk.sin{filter:grayscale(1);opacity:.7}
@keyframes giro{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.wk.on{animation:pulso 2.4s ease-in-out infinite}}
@keyframes pulso{50%{opacity:.35}}
#pop{white-space:pre-line}
.ft summary{cursor:pointer;list-style:none;font-weight:600;color:#1d4ed8}.ft summary::-webkit-details-marker{display:none}
.ft summary::after{content:' ▾';color:var(--mu)}.ft[open] summary::after{content:' ▴'}

.act{display:flex;gap:10px;align-items:center;margin:-8px 0 28px;font-size:12px;color:var(--mu)}
.act button#bt{font:inherit;font-size:18px;line-height:1;border:1px solid var(--li);background:#fff;color:var(--tx);border-radius:999px;width:36px;height:36px;cursor:pointer}.act button#bt.gira{animation:gir 1s linear infinite}@keyframes gir{to{transform:rotate(360deg)}}
.act button:hover{border-color:var(--mu)}.act button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<nav class="nav"><div><a class="on" href="./" aria-current="page">Panel</a><a href="guiones.html">Guiones</a><span>Mis canales</span></div></nav>
<main>
<div class="top"><h1>Panel</h1><button class="bell" id="bell" type="button" aria-label="Notificaciones" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="n" id="bn" hidden></span></button><div class="nl" id="nl"></div></div>
<div class="franja" id="franja" role="button" tabindex="0"></div>
<section class="tot" id="tot"></section>
<div class="act"><button id="bt" type="button" aria-label="Actualizar" title="Actualizar">⟳</button><span id="ed"></span><button class="i" id="inf" type="button" aria-label="Información">i</button></div>
<div class="layout"><section class="grid" id="grid"></section><aside class="lb" id="lb"></aside></div>
<section class="sec" id="tab"></section>
<section class="sec" id="per"></section>
<footer id="pie"></footer>
<div id="pop" role="tooltip"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const N=new Intl.NumberFormat('es-CL');
const hm=d=>d.toLocaleTimeString('es-CL',{timeZone:'America/Santiago',hour:'2-digit',minute:'2-digit'});
const fmt=v=>v==null?null:N.format(Math.round(v*10)/10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hora=iso=>{if(!iso)return null;const d=new Date(iso);return isNaN(d)?null:d.toLocaleString('es-CL',{timeZone:'America/Santiago',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
function delta(v){
  if(!v)return '<span class="eq">–</span>';
  const d=v.delta,c=d>0?'up':d<0?'dn':'eq',a=d>0?'▲':d<0?'▼':'■';
  return `<span class="${c}">${a} ${d>0?'+':''}${fmt(d)}</span>`;
}
function big(v,label,tip){
  return `<div><b>${v==null?'–':fmt(v)}</b><span>${label} ${ib(tip)}</span></div>`;
}
function viejo(c){const t=Date.parse(c.medidoEn||c.fechaDatos);if(!t)return '';const d=Math.floor((Date.now()-t)/864e5);return d>=2?` · <span class="dn">hace ${d} días</span>`:''}
let TAB=null;
const VK='panel.versus';
const versusAbierto=()=>{try{return localStorage.getItem(VK)==='1'}catch(e){return false}};
function urg(slug){
  const ns=((TAB&&TAB.notificaciones)||[]).filter(n=>n.slug===slug);
  if(!ns.length)return '<span class="ok0">✓ al día</span>';
  const crit=ns.some(n=>n.severidad==='critica');
  return `<button class="ub ${crit?'crit':'avi'}" type="button" data-u="${esc(slug)}" aria-expanded="false">● ${ns.length} urgencia${ns.length>1?'s':''}</button>`;
}
function urgLista(slug){
  const ns=((TAB&&TAB.notificaciones)||[]).filter(n=>n.slug===slug);
  return ns.length?`<div class="ul" id="ul-${esc(slug)}">${ns.map(n=>`<div>${n.severidad==='critica'?'🔴':'🟠'} ${esc(n.texto)}${n.limiteTxt?`<small>hasta ${esc(n.limiteTxt)}</small>`:''}</div>`).join('')}</div>`:'';
}
function card(c){
  const dias=v=>v&&v.dias>1?` <i>(${v.dias} d)</i>`:'';
  const med=hora(c.medidoEn)||c.fechaDatos;
  const hayVar=c.varSubs?.ayer||c.varSubs?.sem||c.varVistas?.ayer||c.varVistas?.sem;
  const ab=versusAbierto();
  const hv=c.horasValidas;
  const hvTxt=hv==null?`<div class="hv"><span>Horas válidas para monetizar:</span> <b class="na">sin dato</b> ${ib('hv_na')}</div>`:
   `<div class="hv"><span>Horas válidas para monetizar:</span> <b>${fmt(hv)} / 4.000</b>${c.horasValidasFuente==='estimado'?' <i>(est.)</i>':''} ${ib(c.horasValidasFuente==='estimado'?'hv_est':'hv')}<div class="xp" style="--w:${Math.min(100,Math.max(0.8,hv/40))}%"><u></u></div></div>`;
  return `<article class="card" style="--c:${esc(c.color||'#888')}">
  <div class="head"><img src="${esc(c.avatar)}" alt="" onerror="this.style.visibility='hidden'">
    <div><h2>${esc(c.nombre)}</h2><a href="${esc(c.url||'#')}" target="_blank" rel="noopener">${esc(c.handle||'')}</a></div></div>
  ${c.nicho?`<p class="nicho">${esc(c.nicho)}</p>`:''}
  <div class="m">
    ${big(c.subs,'Suscriptores','m_subs')}
    ${big(c.vistas,'Vistas totales','m_vistas')}
    ${big(c.likes,'Me gusta totales','m_likes')}
    ${big(c.comentarios,'Comentarios totales','m_com')}
  </div>
  ${hvTxt}
  <div class="cf">${urg(c.slug)}<a class="gb" href="guiones.html#${esc(c.slug)}">Guiones</a></div>
  ${urgLista(c.slug)}
  ${hayVar?`<button class="vm" type="button" aria-expanded="${ab}">${ab?'ocultar variaciones':'ver más: variaciones'}</button>
  <div class="var${ab?' on':''}"><span class="h"></span><span class="h">Suscriptores</span><span class="h">Vistas</span>
    ${c.varSubs?.ayer||c.varVistas?.ayer?`<i>vs ayer</i><strong>${delta(c.varSubs?.ayer)}</strong><strong>${delta(c.varVistas?.ayer)}</strong>`:''}
    ${c.varSubs?.sem||c.varVistas?.sem?`<i>vs 7 días</i><strong>${delta(c.varSubs?.sem)}${dias(c.varSubs?.sem)}</strong><strong>${delta(c.varVistas?.sem)}${dias(c.varVistas?.sem)}</strong>`:''}
  </div>`:''}
  ${med?`<div class="fe">Medido: ${esc(med)}${viejo(c)}</div>`:''}
</article>`;
}
const TIP={
 m_subs:'Suscriptores: personas que siguen el canal ahora mismo.',
 m_vistas:'Vistas totales: todas las reproducciones de todos los videos y Shorts del canal desde su creación.',
 m_likes:'Me gusta totales: suma de los me gusta de todos los videos y Shorts públicos del canal.',
 m_com:'Comentarios totales: suma de los comentarios de todos los videos y Shorts públicos del canal.',
 hv:'Horas válidas para monetizar: horas vistas en los últimos 12 meses solo de videos LARGOS públicos (los Shorts no cuentan). YouTube pide 4.000 para entrar al programa de socios. Medido con YouTube Analytics.',
 hv_est:'Horas válidas para monetizar (estimadas): horas de videos largos de los últimos 12 meses calculadas por el repo del canal como vistas × duración × 40 % de retención. YouTube pide 4.000.',
 hv_na:'Sin dato: este canal aún no tiene acceso a YouTube Analytics, así que no se pueden medir las horas de videos largos (las 4.000 h no cuentan Shorts).',
 puntaje:'Puntaje = promedio de los % de monetización: suscriptores (meta 1.000), vistas de Shorts en 90 días (meta 10 M) y horas válidas para monetizar (solo videos largos, 12 meses; meta 4.000). Cada criterio tiene tope 100 %.',
 ritmo:'Ritmo = promedio de lo avanzado en la última semana: suscriptores nuevos, vistas nuevas y videos publicados, frente a la meta semanal de cada canal. No entra al puntaje; de él sale el ganador de la semana.',
 flecha:'Flecha: puestos que subió (▲) o bajó (▼) frente al cierre de ayer (última medición antes de las 00:00, hora de Chile). "–" = se mantuvo; "nuevo" = ayer aún no puntuaba.',
 est:'Estimado: el canal tiene menos de 90 días, así que se usan sus vistas totales como vistas de 90 días.',
 trofeo:'Ganador de la semana: el canal con mejor ritmo.'
};
const pf=v=>v==null?'–':(Math.round(v*10)/10).toLocaleString('es-CL')+' %';
const pn=v=>v==null?'–':(Math.round(v*100)/100).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2});
const ib=k=>`<button class="i" type="button" data-tip="${k}" aria-label="Información">i</button>`;
function mv(c){
  if(!c||c.estado==='sin-datos')return '<span class="mv eq">–</span>';
  if(c.estado==='nuevo')return '<span class="mv nw">nuevo</span>';
  if(c.estado==='igual'||!c.puestos)return '<span class="mv eq">–</span>';
  const up=c.estado==='sube';
  return `<span class="mv ${up?'up':'dn'}">${up?'▲':'▼'}${c.puestos}</span>`;
}
function stats(t){
  const g=(id,tit,r)=>`<div class="g"><span>${tit}</span><span>${r&&r.puntaje!=null?pf(r.puntaje)+' · '+r.n+'/'+r.total:''}</span></div>`+t.criterios.filter(x=>x.grupo===id).map(x=>`<div class="sr"><span>${esc(x.nombre)}</span><b>${x.pct==null?'–':pf(x.pct)}${x.estimado?ib('est'):''}</b><div class="sb"><u style="width:${x.pct||0}%"></u></div>${x.valor!=null?`<div class="vv">${fmt(x.valor)} / ${fmt(x.meta)} ${esc(x.unidad||'')}</div>`:''}</div>`).join('');
  return `<div class="st">${g('monetizacion','Monetización',{puntaje:t.puntaje,n:t.n,total:t.total})}${g('ritmo','Ritmo semanal',t.ritmo)}</div>`;
}
const POS_KEY='panel.posiciones';
function leaderboard(p){
  let prev={};try{prev=JSON.parse(localStorage.getItem(POS_KEY)||'{}')}catch(e){}
  const gan=p.ganadorSemana&&p.ganadorSemana.slug;
  const filas=p.tabla.map((t,k)=>{
    return `<div class="r p${t.posicion}" style="--c:${esc(t.color)};--k:${k};--w:${Math.min(100,Math.max(1.5,t.puntaje||0))}%" tabindex="0" role="button" aria-expanded="false">
    <div class="rm"><div class="ps"><span class="med">${t.posicion}</span>${mv(t.cambio24h)}</div>
    <div class="who"><img src="${esc(t.avatar)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(t.nombre)}${gan===t.slug?'<span class="tro" title="Ganador de la semana">🏆</span>':''}</b><div class="tg">ritmo ${pf(t.ritmo&&t.ritmo.puntaje)}</div></div></div>
    <div class="sc"><b>${pn(t.puntaje)}</b><small>puntaje</small></div></div>
    <div class="xp"><u></u></div>${stats(t)}</div>`;}).join('');
  try{localStorage.setItem(POS_KEY,JSON.stringify(Object.fromEntries(p.tabla.map(t=>[t.slug,t.posicion]))))}catch(e){}
  return `<div class="lbh"><h2>Clasificación</h2><span class="sp"></span>${ib('puntaje')}${ib('ritmo')}${ib('flecha')}</div><div class="rows">${filas}</div>`;
}
/* ---------- tablero, permisos y notificaciones (solo lectura) ---------- */
const IC={ok:'✓',bad:'✗',warn:'●',na:'–',sd:'–'};
const dsd=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return '';const h=hm(d),f=x=>x.toLocaleDateString('en-CA',{timeZone:'America/Santiago'});return f(d)===f(new Date())?'desde '+h:'desde '+d.toLocaleDateString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit'})+' '+h};
let WN=0;
const tag=(c,disp)=>{if(!c||(c.estado!=='warn'&&c.estado!=='bad')||!disp)return '';const w=c.trabajo;const k='w_'+(WN++);
 if(!w||!w.asignado){TIP[k]='Sin asignar'+(w&&w.detalle?'\n'+w.detalle:'');return `<div><button class="wk sin" type="button" data-tip="${k}" aria-label="Sin asignar">⏸</button></div>`}
 TIP[k]=`Agente: ${w.agente}${w.desde?'\n'+dsd(w.desde):''}\n${w.detalle||''}`;return `<div><button class="wk on" type="button" data-tip="${k}" aria-label="En trabajo">🔧</button></div>`};
const cel=c=>!c?'<div class="cl s-sd"><span class="ic">–</span><div><b>sin dato</b></div></div>':`<div class="cl s-${c.estado}"><span class="ic">${IC[c.estado]||'–'}</span><div><b>${esc(c.texto)}</b>${c.detalle?`<small>${esc(c.detalle)}</small>`:''}</div></div>`;
function antig(t){const m=Math.round((Date.now()-Date.parse(t.generadoEn))/60000);if(!(m>=0))return '';return m<90?`hace ${m} min`:`hace ${Math.floor(m/60)} h`}
function tablero(t){
  if(!t)return ['',''];
  WN=0;
  t.tareas.forEach(x=>{TIP['t_'+x.id]=x.ayuda});
  const stale=(Date.now()-Date.parse(t.generadoEn))>6*36e5;
  const pie=`<div class="fe2">Tablero calculado ${antig(t)} (${esc(hora(t.generadoEn)||'')})${stale?' · <span class="dn">puede estar desactualizado: el PC no lo ha renovado</span>':''}. Semana objetivo: hasta el domingo ${esc(t.semana.hasta.slice(8)+'-'+t.semana.hasta.slice(5,7))}.</div>`;
  const tw=t.trabajo||{disponible:false,items:[]},disp=!!tw.disponible;
  const cn=Object.fromEntries(t.canales.map(c=>[c.slug,c]));const tn=Object.fromEntries(t.tareas.map(x=>[x.id,x.nombre]));
  const its=tw.items.filter(w=>w.asignado);
  const ft=!disp?`<div class="ft off">Trabajo de agentes: sin información de agentes${tw.actualizado?` (último dato ${esc(hora(tw.actualizado)||'')})`:''}.</div>`:`<details class="ft"${FT_OPEN?' open':''}><summary>🔧 ${its.length} trabajo${its.length===1?'':'s'} en curso</summary>${its.length?its.map(w=>{const c=cn[w.canal]||{nombre:w.canal,color:'#888'};return `<div class="fi" style="--c:${esc(c.color)}"><span class="fc">${esc(c.nombre)}</span><span class="fq">${esc(w.tareas.map(i=>tn[i]||i).join(' · '))}</span><span class="fa">${esc(w.agente)}${w.desde?` · ${esc(dsd(w.desde))}`:''}</span><small>${esc(w.detalle)}</small></div>`}).join(''):'<div class="fi">nadie asignado</div>'}</details>`;
  const tb=`${ft}<h2>Tareas por canal</h2><p class="sub">Solo lectura. Semana objetivo hasta el domingo ${esc(t.semana.hasta.slice(8)+'-'+t.semana.hasta.slice(5,7))}.</p><div class="tw"><table class="tb"><thead><tr><th></th>${t.canales.map(c=>`<th style="--c:${esc(c.color)}">${esc(c.nombre)}</th>`).join('')}</tr></thead><tbody>${t.tareas.map(x=>`<tr><th>${esc(x.nombre)} ${ib('t_'+x.id)}</th>${t.canales.map(c=>`<td>${cel(x.celdas[c.slug])}${tag(x.celdas[c.slug],disp)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const ROT={token:'Token YouTube',scopes:'Permisos API',telefono:'Teléfono',auditoria:'Auditoría API',repo:'Repo GitHub',nube:'Render en nube',ultima:'Última corrida'};
  const AY={token:'Estado del token OAuth de YouTube del canal: fecha de vencimiento (caduca a los 7 días mientras la API no esté auditada). Entender Chile lo guarda como secreto en GitHub.',scopes:'Qué puede hacer el token: subir, comentarios y analytics.',telefono:'Verificación por teléfono del canal (habilita miniaturas personalizadas y más cupo de subida).',auditoria:'Auditoría de la API de YouTube: si está aprobada, los tokens dejan de caducar.',repo:'Si el repo del canal está en GitHub y es público (necesario para Actions gratis).',nube:'Si el canal puede renderizar/producir en GitHub Actions.',ultima:'Última corrida de la producción del canal (o de sus métricas si no tiene nube diaria).'};
  Object.keys(AY).forEach(k=>{TIP['p_'+k]=AY[k]});
  const g=t.permisos.globales.ytApiKey;
  const pm=`<h2>Permisos y salud</h2><p class="sub">Solo estados y fechas; nunca se muestran valores de tokens.</p><div class="tw"><table class="tb"><thead><tr><th></th>${t.canales.map(c=>`<th style="--c:${esc(c.color)}">${esc(c.nombre)}</th>`).join('')}</tr></thead><tbody>${Object.keys(ROT).map(k=>`<tr><th>${ROT[k]} ${ib('p_'+k)}</th>${t.canales.map(c=>{const f=t.permisos.filas.find(x=>x.slug===c.slug);return `<td>${cel(f&&f.items[k])}</td>`}).join('')}</tr>`).join('')}<tr><th>Clave del panel (YT_API_KEY)</th><td colspan="${t.canales.length}">${cel(g)}</td></tr></tbody></table></div>${pie}`;
  return [tb,pm];
}
function campana(t){
  const bell=$('bell'),bn=$('bn'),nl=$('nl'),fr=$('franja');
  const ns=(t&&t.notificaciones)||[];
  const crit=ns.filter(n=>n.severidad==='critica');
  bn.hidden=!ns.length;bn.textContent=ns.length;bell.classList.toggle('crit',crit.length>0);
  const lim=n=>n.limiteTxt?`<small>hasta ${esc(n.limiteTxt)}</small>`:'';
  nl.innerHTML=`<h3>Requiere tu mano (${ns.length})</h3>`+(ns.length?ns.map(n=>`<div class="ni ${n.severidad}"><span class="d"></span><div><b>${esc(n.canal)}:</b> ${esc(n.texto)}${lim(n)}</div></div>`).join(''):'<div class="ni vacio">Nada pendiente.</div>');
  if(crit.length){fr.classList.add('on');fr.innerHTML=`<b>${crit.length} crítica${crit.length>1?'s':''}</b><span>${esc(crit[0].canal)}: ${esc(crit[0].texto)}</span>`}else fr.classList.remove('on');
}
let FT_OPEN=false;
let proximaMs=null,medidoMs=null,INFO='';
let msg='',ultHash=null,ultCambio=null;
function reloj(){
  const m=medidoMs?Math.max(0,Math.round((Date.now()-medidoMs)/60000)):null;
  const d=m==null?'':'datos de hace '+(m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min');
  $('ed').textContent=[msg,d].filter(Boolean).join(' · ');
}
async function cargar(){
  const bt=$('bt');bt.disabled=true;bt.classList.add('gira');msg='actualizando…';reloj();
  const ini=Date.now();
  try{
    const j=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error(u+' '+x.status);return x.json()});
    const [r,p,a,tab]=await Promise.all([j('data/resumen.json'),j('data/puntajes.json').catch(()=>null),j('data/adelantamientos.json').catch(()=>null),j('data/tablero.json').catch(()=>null)]);
    const h=(tab&&tab.generadoEn||'')+(r.generadoEn||'')+'|'+(p&&p.generadoEn||'')+'|'+((r.actualizacion||{}).medidoEn||'');
    const igual=ultHash===h;
    const t=r.totales;
    $('tot').innerHTML=[[t.subs,'suscriptores'],[t.vistas,'vistas'],[t.videos,'videos'],[t.canales,'canales']].map(([v,l])=>`<div><b>${fmt(v)}</b><span>${l}</span></div>`).join('');
    const orden=p?p.tabla.map(x=>x.slug):[];
    const cs=[...r.canales].sort((x,y)=>{const i=orden.indexOf(x.slug),j2=orden.indexOf(y.slug);return (i<0?99:i)-(j2<0?99:j2)});
    TAB=tab;$('grid').innerHTML=cs.map(card).join('');
    $('lb').innerHTML=p?leaderboard(p):'<div class="lbh"><h2>Clasificación</h2></div>';
    const [h1,h2]=tablero(tab);$('tab').innerHTML=h1;$('per').innerHTML=h2;campana(tab);
    const ac=r.actualizacion||{};
    medidoMs=Date.parse(ac.medidoEn||r.generadoEn)||null;proximaMs=Date.parse(ac.proxima||'')||null;
    if(!igual||ultCambio==null)ultCambio=new Date();
    msg=ultHash==null?'actualizado '+hm(new Date()):igual?'sin cambios desde '+hm(ultCambio):'actualizado '+hm(new Date());
    ultHash=h;
    INFO='Los datos se miden cada hora (desde el PC de Santiago y, si está apagado, desde la nube) y la página solo se republica cuando cambian los números. GitHub Pages guarda copias hasta ~10 min, así que un cambio recién publicado puede tardar en verse. ⟳ vuelve a pedir el último dato publicado. Publicado: '+(hora(r.generadoEn)||'')+(proximaMs?'. Próxima medición ≈ '+hm(new Date(proximaMs)):'')+(ac.error?'. La última consulta a la API falló: se muestra lo último conocido.':'');
  }catch(e){msg='sin conexión, reintenta';}
  reloj();
  setTimeout(()=>{bt.disabled=false;bt.classList.remove('gira')},Math.max(0,700-(Date.now()-ini)));
}
const pop=$('pop');
function abre(b,txt){pop.textContent=txt;pop.style.display='block';const r=b.getBoundingClientRect(),w=pop.offsetWidth;pop.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+scrollX-w/2+8))+'px';pop.style.top=(r.bottom+scrollY+8)+'px';pop._b=b}
document.addEventListener('click',e=>{
  const bl=e.target.closest('#bell,#franja');
  if(bl){const o=$('nl').classList.toggle('open');$('bell').setAttribute('aria-expanded',o);pop.style.display='none';return}
  if(!e.target.closest('#nl')){$('nl').classList.remove('open');$('bell').setAttribute('aria-expanded','false')}
  const ub=e.target.closest('.ub');
  if(ub){const l=document.getElementById('ul-'+ub.dataset.u);if(l){const o=l.classList.toggle('on');ub.setAttribute('aria-expanded',o)}pop.style.display='none';return}
  const vm=e.target.closest('.vm');
  if(vm){const v=vm.nextElementSibling,o=v.classList.toggle('on');vm.textContent=o?'ocultar variaciones':'ver más: variaciones';vm.setAttribute('aria-expanded',o);try{localStorage.setItem(VK,o?'1':'0')}catch(x){}return}
  const sm=e.target.closest('.ft summary');if(sm){setTimeout(()=>{FT_OPEN=!!document.querySelector('.ft[open]')},0);return}
  const b=e.target.closest('.i,.wk');
  if(b){e.stopPropagation();e.preventDefault();if(pop.style.display==='block'&&pop._b===b){pop.style.display='none';return}abre(b,b.id==='inf'?INFO:TIP[b.dataset.tip]||'');return}
  pop.style.display='none';
  const r=e.target.closest('.r');if(r){const o=r.classList.toggle('open');r.setAttribute('aria-expanded',o)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){pop.style.display='none';$('nl').classList.remove('open')}if((e.key==='Enter')&&e.target.id==='franja'){e.target.click()}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('r')){e.preventDefault();e.target.click()}});
$('bt').onclick=cargar;setInterval(reloj,30000);setInterval(()=>{if(!document.hidden)cargar()},300000);cargar();
</script>
