<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guiones · Canales</title>
<style>
:root{--tx:#111827;--mu:#6b7280;--li:#e5e7eb;--c:#888}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--tx);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top a{color:var(--mu);text-decoration:none;font-size:14px;border:1px solid var(--li);border-radius:999px;padding:6px 12px}
h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0;font-weight:600}
.sub{font-size:13px;color:var(--mu);margin:0 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tab{flex:none;border:1px solid var(--li);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;border-left:6px solid var(--c)}
.tab[aria-selected=true]{background:#111827;color:#fff;border-color:#111827;border-left-color:var(--c)}
.tab small{opacity:.7;margin-left:4px}
.cnt{font-size:13px;color:var(--mu);margin:6px 0 14px}
.dia{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px}
.it{display:block;width:100%;text-align:left;border:1px solid var(--li);border-left:5px solid var(--c);border-radius:14px;background:#fff;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer;color:inherit}
.it:hover{border-color:var(--mu);border-left-color:var(--c)}
.it b{display:block;font-size:17px;line-height:1.3;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mu);margin-top:6px}
.bd{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:#f3f4f6;color:#374151}
.bd.programado{background:#dcfce7;color:#166534}.bd.publicado{background:#e0e7ff;color:#3730a3}.bd.renderizado{background:#fef3c7;color:#92400e}
.bd.en\ backlog{background:#f3f4f6;color:#374151}.bd.sin\ asignar{background:#fee2e2;color:#991b1b}.bd.privado{background:#fae8ff;color:#86198f}.bd.guion\ del\ día{background:#e0f2fe;color:#075985}
/* lector */
#rd{display:none;position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
#rd.on{display:block}
.rw{max-width:720px;margin:0 auto;padding:16px 18px 100px}
.rb{position:sticky;top:0;background:#fffe;backdrop-filter:blur(6px);display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--li);margin-bottom:14px}
.rb button{font:inherit;font-size:14px;border:1px solid var(--li);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer}
.rb button:disabled{opacity:.35}.rb .sp{flex:1}
.rw h2{font-size:26px;line-height:1.25;margin:6px 0 8px}
.rw h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:28px 0 8px;font-weight:600}
.rw p{font-size:19px;line-height:1.6;margin:0 0 14px}
.rw p.m{font-size:13px;color:var(--mu);margin:-6px 0 10px;font-family:ui-monospace,monospace}
.fk{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 0;border-top:1px solid #f1f2f4}
.fk span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.fk div{font-size:17px;white-space:pre-wrap}
.ap{margin:22px 0 4px;border:1px dashed #cbd5e1;border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mu);background:#f8fafc}
.ap b{color:#374151}
a{color:#1d4ed8}
.src{font-size:14px;color:#374151;margin:0 0 6px;word-break:break-word}
.vacio{padding:30px 0;color:var(--mu);text-align:center}
.nav{position:sticky;top:0;z-index:15;background:#fffe;backdrop-filter:blur(8px);border-bottom:1px solid var(--li)}
.nav div{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:4px;align-items:center}
.nav a{padding:13px 14px;font-size:14px;font-weight:600;color:var(--mu);text-decoration:none;border-bottom:3px solid transparent}
.nav a.on{color:var(--tx);border-bottom-color:var(--tx)}
.nav span{margin-left:auto;font-size:12px;color:#9ca3af}
.top a{color:var(--tx);font-weight:600}
</style>
</head>
<body>
<nav class="nav"><div><a href="./">Panel</a><a class="on" href="guiones.html" aria-current="page">Guiones</a><span>Guiones por canal</span></div></nav>
<main>
<div class="top"><a href="./">← Panel</a><h1>Guiones</h1></div>
<p class="sub" id="sub">Cargando…</p>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="cnt" id="cnt"></div>
<div id="lista"></div>
</main>
<div id="rd" role="dialog" aria-modal="true"><div class="rw" id="rw"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const j=u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw new Error(u+' '+x.status);return x.json()});
const DS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fecha=f=>{if(!f)return null;const d=new Date(f+'T12:00:00');return `${DS[d.getDay()]} ${f.slice(8)}-${f.slice(5,7)}`};
let IDX=null,CUR=null,DATA={},LIST=[],POS=0;
async function canal(slug){if(!DATA[slug])DATA[slug]=await j('data/guiones/'+slug+'.json');return DATA[slug]}
function tabs(){$('tabs').innerHTML=IDX.canales.map(c=>`<button class="tab" role="tab" style="--c:${esc(c.color)}" aria-selected="${c.slug===CUR}" data-s="${esc(c.slug)}">${esc(c.nombre)}<small>${c.total}</small></button>`).join('')}
async function pintar(){
  tabs();const c=IDX.canales.find(x=>x.slug===CUR);const d=await canal(CUR);LIST=d.items;
  $('cnt').textContent=`${c.ventana} · ${Object.entries(c.porEstado).map(([k,v])=>v+' '+k).join(' · ')||'sin guiones'}`;
  if(!LIST.length){$('lista').innerHTML='<div class="vacio">Sin guiones en esta ventana.</div>';return}
  let h='',ult=null;
  LIST.forEach((i,n)=>{
    const k=i.fecha||'sin';
    if(k!==ult){ult=k;h+=`<div class="dia">${i.fecha?esc(fecha(i.fecha)):'Sin fecha asignada'}</div>`}
    h+=`<button class="it" style="--c:${esc(d.color)}" data-n="${n}"><b>${esc(i.titulo)}</b><div class="meta"><span class="bd ${esc(i.estado)}">${esc(i.estado)}</span>${i.hora?`<span>${esc(i.hora)}${i.ranuraPlan?' (según plan)':''}</span>`:''}<span>${esc(i.plantilla)}${i.formato?' · '+esc(i.formato):''}</span>${i.palabras?`<span>${i.palabras} palabras</span>`:''}</div></button>`;
  });
  $('lista').innerHTML=h;
}
function leer(n){
  POS=n;const i=LIST[n];const d=DATA[CUR];
  const par=p=>typeof p==='string'?`<p>${esc(p)}</p>`:`<p class="m">${esc(p.x)}</p>`;
  let h=`<div class="rb"><button id="cx">← Lista</button><button id="pv" ${n<=0?'disabled':''}>‹</button><button id="nx" ${n>=LIST.length-1?'disabled':''}>›</button><span class="sp"></span><small style="color:var(--mu)">${n+1}/${LIST.length}</small></div>`;
  h+=`<div class="meta" style="margin:0"><span class="bd ${esc(i.estado)}">${esc(i.estado)}</span>${i.fecha?`<span>${esc(fecha(i.fecha))}${i.hora?' · '+esc(i.hora):''}${i.ranuraPlan?' (según plan)':''}</span>`:''}<span>${esc(i.plantilla)}${i.formato?' · '+esc(i.formato):''}</span></div>`;
  h+=`<h2>${esc(i.titulo)}</h2>`;
  if(i.url)h+=`<p style="font-size:16px"><a href="${esc(i.url)}" target="_blank" rel="noopener">▶ Ver en YouTube</a></p>`;
  h+=`<div class="ap"><b>Aprobación:</b> pendiente de activar</div>`;
  if(i.bloques.length){h+=i.bloques.map(b=>`<h3>${esc(b.h)}</h3>${b.t.map(par).join('')}`).join('')}
  if(i.ficha.length){h+=`<h3>${i.bloques.length?'Datos':'Ficha'}</h3>`+i.ficha.map(([k,v])=>`<div class="fk"><span>${esc(k)}</span><div>${esc(v)}</div></div>`).join('')}
  if(i.fuentes&&i.fuentes.length){h+=`<h3>Fuentes</h3>`+i.fuentes.map(s=>{const m=s.match(/https?:\/\/\S+/);return `<p class="src">${m?esc(s.slice(0,m.index))+`<a href="${esc(m[0])}" target="_blank" rel="noopener">${esc(m[0])}</a>`:esc(s)}</p>`}).join('')}
  if(i.sinGuion)h+=`<p class="m">El guion completo de este video no está en el repo; solo se muestra la ficha de la bandeja.</p>`;
  $('rw').innerHTML=h;$('rd').classList.add('on');$('rd').scrollTop=0;history.replaceState(null,'','#'+encodeURIComponent(CUR+'/'+i.id));
}
function cerrar(){$('rd').classList.remove('on');history.replaceState(null,'',location.pathname)}
document.addEventListener('click',async e=>{
  const t=e.target.closest('.tab');if(t){CUR=t.dataset.s;await pintar();return}
  const it=e.target.closest('.it');if(it){leer(+it.dataset.n);return}
  if(e.target.closest('#cx'))cerrar();else if(e.target.closest('#pv')&&POS>0)leer(POS-1);else if(e.target.closest('#nx')&&POS<LIST.length-1)leer(POS+1);
});
document.addEventListener('keydown',e=>{if(!$('rd').classList.contains('on'))return;if(e.key==='Escape')cerrar();if(e.key==='ArrowLeft'&&POS>0)leer(POS-1);if(e.key==='ArrowRight'&&POS<LIST.length-1)leer(POS+1)});
(async()=>{
  try{
    IDX=await j('data/guiones/index.json');
    const gen=new Date(IDX.generadoEn);
    $('sub').textContent=`Semana en curso y la siguiente (${IDX.ventana.desde.slice(8)}-${IDX.ventana.desde.slice(5,7)} al ${IDX.ventana.hasta.slice(8)}-${IDX.ventana.hasta.slice(5,7)}); Entender Chile: últimos 7 días. Actualizado ${gen.toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}.`;
    const h=decodeURIComponent((location.hash||'').slice(1)).split('/');
    CUR=(h[0]&&IDX.canales.some(c=>c.slug===h[0]))?h[0]:IDX.canales[0].slug;
    await pintar();
    if(h[1]){const n=LIST.findIndex(i=>i.id===h.slice(1).join('/'));if(n>=0)leer(n)}
  }catch(err){$('sub').textContent='No se pudieron cargar los guiones: '+err.message}
})();
</script>
</body>
</html>
